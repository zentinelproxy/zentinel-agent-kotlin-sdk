# Build and test the SDK, then run its agents behind a real zentinel.
#
# The repository had no CI. Its unit tests passed while no agent built with
# it could complete a handshake with the proxy (zentinel#600), so the
# conformance job below is the check that matters.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        # Compiles the SDK and examples, runs the unit and wire tests. The
        # integration test skips itself without ZENTINEL_BIN; the conformance
        # job runs the same checks against a real proxy.
        run: ./gradlew build

  conformance:
    # The SDK's agents behind a real zentinel binary, through the shared
    # harness in zentinelproxy/zentinel (sdk-conformance/): handshake,
    # configure, header mutations, block, body inspection, reconnect, over
    # UDS and gRPC.
    name: Conformance (agent protocol v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the examples
        # Built before the harness starts them: it waits 120 s for an agent
        # to listen, and starts each one twice.
        run: ./gradlew installExamples

      # Checked against the pinned Zentinel release. 26.10_8 is the first that
      # delivers the agent's `config { }` block (zentinel#603), which the
      # configure check needs.
      - name: Conformance agent (UDS + gRPC)
        uses: zentinelproxy/zentinel/sdk-conformance@main
        with:
          zentinel-version: 26.10_8
          agent-command: java -cp 'build/examples/lib/*' io.raskell.zentinel.agent.examples.ConformanceAgentKt --socket {socket}
          grpc-agent-command: java -cp 'build/examples/lib/*' io.raskell.zentinel.agent.examples.ConformanceAgentKt --grpc {grpc}

      - name: README quick-start agent
        uses: zentinelproxy/zentinel/sdk-conformance@main
        with:
          zentinel-version: 26.10_8
          profile: hello
          agent-command: java -cp 'build/examples/lib/*' io.raskell.zentinel.agent.examples.HelloAgentKt {socket}
